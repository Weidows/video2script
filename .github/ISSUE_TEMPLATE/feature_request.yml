name: Feature request
description: Suggest a new capability or a rule improvement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Cleaning rules (fillers / stutters / repeats)
        - Speech recognition (model, language, VAD)
        - Speaker diarization
        - Subtitles / video output
        - GUI
        - Packaging / CI
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What problem does it solve?
      description: Describe the transcript you cannot get today, with a concrete example if possible.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: New CLI flag, output file, rule, or API. Screenshots / examples welcome.
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you tried
      description: Existing flags, other tools, manual workarounds.
    validations:
      required: false
