name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  rules:
    name: rule layer (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # 规则层是纯标准库实现：只装 dev 组（pytest/pillow），不拉 ctranslate2/faster-whisper
      # --locked：锁文件与 pyproject 不一致就直接失败（防止有人改了依赖忘了 uv lock）
      - run: uv sync --locked --only-group dev
      - run: uv run --no-sync pytest -q
        env:
          PYTHONPATH: src

  import:
    name: imports with real deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --locked                     # 真依赖（faster-whisper / ctranslate2 等）
      - run: |
          uv run --no-sync python -c "import video2script, faster_whisper; print(video2script.__version__)"
          uv run --no-sync video2script --help
          uv run --no-sync python -c "from video2script.gui import PAGE; assert 'video2script' in PAGE"
      - name: Lockfile is up to date
        run: uv lock --check
