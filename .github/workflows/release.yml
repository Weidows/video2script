name: Release executables

# 打 tag（如 v0.1.0）时自动构建三平台免安装可执行文件并挂到 Release 上
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: build exe (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[build]"
      - run: python scripts/build_exe.py
      - name: Smoke test (windows/macos)
        if: runner.os != 'Linux'
        shell: bash
        run: |
          dist/video2script --help
          dist/video2script-gui --help
      - uses: actions/upload-artifact@v4
        with:
          name: video2script-${{ matrix.os }}
          path: |
            dist/video2script
            dist/video2script.exe
            dist/video2script-gui
            dist/video2script-gui.exe
          if-no-files-found: ignore

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
