name: Release

# 打 tag（如 v0.2.0）时自动构建三平台可执行文件 + sdist/wheel，并挂到 GitHub Release。
# 也可以在 Actions 页面手动 workflow_dispatch 触发，只构建、不发 Release（用于验证打包）。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exe:
    name: exe · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Sync build deps (pyinstaller + pillow)
        run: uv sync --locked --extra build
      - name: Generate icon
        run: uv run --no-sync python scripts/make_icon.py
      - name: Build standalone binary
        run: uv run --no-sync python scripts/build_exe.py
      - name: Smoke test (one binary serves CLI + GUI)
        shell: bash
        run: |
          set -eux
          BIN=dist/video2script
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          "$BIN" --version
          "$BIN" --help                 # CLI 帮助
          "$BIN" --gui --help           # 同一个可执行文件的 GUI 入口
      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.os }}
          path: |
            dist/video2script
            dist/video2script.exe
          if-no-files-found: error

  dist:
    name: sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv build                       # 等价 python -m build，用 pyproject 里的后端
      - name: Check metadata
        run: uvx twine check dist/*
      - name: Verify the wheel installs and runs
        run: |
          set -eux
          uv venv /tmp/venv-wheel --python 3.12
          uv pip install --python /tmp/venv-wheel/bin/python dist/*.whl
          /tmp/venv-wheel/bin/video2script --help
          /tmp/venv-wheel/bin/python -c "import video2script; print(video2script.__version__)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
          if-no-files-found: error

  release:
    name: publish GitHub Release
    needs: [exe, dist]
    # 手动触发（workflow_dispatch）时只构建、不发版
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect release assets
        run: |
          set -eux
          mkdir -p release
          cp artifacts/dist/* release/
          # macOS 与 Linux 的产物同名（都没有 .exe），必须按平台改名，否则会互相覆盖
          for d in artifacts/exe-*; do
            [ -d "$d" ] || continue
            plat=$(basename "$d" | sed -e 's/^exe-//' -e 's/-latest$//')
            [ "$plat" = "ubuntu" ] && plat=linux
            for f in "$d"/*; do
              [ -f "$f" ] || continue
              base=$(basename "$f")
              case "$base" in
                *.exe) cp "$f" "release/${base%.exe}-${plat}.exe" ;;
                *)     cp "$f" "release/${base}-${plat}" ;;
              esac
            done
          done
          ls -la release/
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
