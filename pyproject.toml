[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "video2script"
version = "0.4.0"
description = "Video/audio to transcript with fillers, stutters and repetitions removed — CPU-only, explainable rules, CLI + local web GUI"
readme = "README.md"
requires-python = ">=3.9"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE"]
authors = [{ name = "Weidows" }]
keywords = ["asr", "whisper", "disfluency", "transcription", "subtitle", "speech"]
classifiers = [
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["faster-whisper>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=7,<9", "pillow>=10,<13"]
diar = ["sherpa-onnx>=1.10,<2"]
build = ["pyinstaller>=6,<7", "pillow>=10,<13"]
all = ["video2script[dev,diar,build]"]

# PEP 735 依赖组：`uv sync` 默认就会装上（等价于 pip 的 --extra dev）。
# 与 [project.optional-dependencies] 的 dev 保持一致，有测试守着手写漂移。
[dependency-groups]
dev = ["pytest>=7,<9", "pillow>=10,<13"]

[tool.uv]
# 云端 CI 与本地都希望 uv 直接管理 .venv；不做 editable 之外的额外处理
package = true
# onnxruntime（faster-whisper 的 VAD 依赖）从 1.20 起不再提供 cp39 wheel，
# 给它单独钉一个上限，让锁文件里同时保留 py3.9 与 py>=3.10 两套解析结果。
constraint-dependencies = ["onnxruntime<1.20; python_version < '3.10'"]

[project.scripts]
video2script = "video2script.main:main"
# 兼容保留：等价于 `video2script --gui`
video2script-gui = "video2script.gui:main"

[project.urls]
Homepage = "https://github.com/Weidows/video2script"
Changelog = "https://github.com/Weidows/video2script/blob/master/CHANGELOG.md"
Issues = "https://github.com/Weidows/video2script/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
video2script = ["assets/*.png", "assets/*.ico", "assets/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
