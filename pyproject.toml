[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "video2script"
version = "0.1.0"
description = "Video/audio to transcript with fillers, stutters and repetitions removed — CPU-only, explainable rules, CLI + local web GUI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "video2script contributors" }]
keywords = ["asr", "whisper", "disfluency", "transcription", "subtitle", "speech"]
classifiers = [
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = ["faster-whisper>=1.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=7,<9"]
diar = ["sherpa-onnx>=1.10,<2"]
build = ["pyinstaller>=6,<7"]
all = ["video2script[dev,diar,build]"]

[project.scripts]
video2script = "video2script.cli:main"
video2script-gui = "video2script.gui:main"

[project.urls]
Homepage = "https://github.com/OWNER/video2script"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
